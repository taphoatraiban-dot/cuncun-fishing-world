<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUNCUN Character Studio</title><style>body{margin:0;background:#0b1c2c;color:white;font:16px system-ui}main{max-width:950px;margin:auto;padding:16px;display:grid;grid-template-columns:1fr 320px;gap:16px}#view{height:75vh;min-height:440px;background:linear-gradient(#426f92,#152e42);border-radius:18px}aside{background:#173348;border-radius:18px;padding:18px}label{display:block;margin:14px 0}select,button{display:block;width:100%;padding:12px;border:0;border-radius:9px;margin-top:6px}button{background:#17a68b;color:white;font-weight:bold}p{color:#bed0dc}@media(max-width:700px){main{display:block}#view{height:55vh;min-height:350px}}</style></head><body><main><div id="view"></div><aside><h2>🎣 CUNCUN · Nhân vật</h2><p>Bản thử nghiệm tùy chỉnh ngoại hình. Nhân vật hiện là mô hình dựng tạm, chưa phải người thật 3D từ Blender.</p><label>Kiểu nhân vật<select id="body"><option value="0">Nam</option><option value="1">Nữ</option></select></label><label>Gương mặt<select id="face"><option value="0">Mẫu 1</option><option value="1">Mẫu 2</option><option value="2">Mẫu 3</option><option value="3">Mẫu 4</option></select></label><label>Tóc<select id="hair"><option value="0">Tóc ngắn</option><option value="1">Tóc dài</option><option value="2">Tóc búi</option><option value="3">Tóc gọn</option></select></label><label>Trang phục<select id="outfit"><option value="0">Đồ câu xanh</option><option value="1">Đồ câu cam</option><option value="2">Đồ thể thao</option><option value="3">VIP</option></select></label><button id="random">🎲 Tạo ngẫu nhiên</button><button id="save">💾 Lưu ngoại hình</button><p id="status" role="status"></p><a href="./index.html" style="color:#8ef7df">← Trở về hồ câu</a></aside></main><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const ids=['body','face','hair','outfit'],els=Object.fromEntries(ids.map(k=>[k,document.getElementById(k)]));const view=document.getElementById('view'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,.1,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.appendChild(renderer.domElement);camera.position.set(0,1.7,5.2);camera.lookAt(0,1.45,0);scene.add(new THREE.HemisphereLight(0xffffff,0x536477,2));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(3,5,4);scene.add(key);const ground=new THREE.Mesh(new THREE.CircleGeometry(2,48),new THREE.MeshStandardMaterial({color:0x3b6570}));ground.rotation.x=-Math.PI/2;scene.add(ground);const avatar=new THREE.Group();scene.add(avatar);const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});function part(geo,color,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(geo,material(color));m.position.set(x,y,z);m.scale.set(sx,sy,sz);avatar.add(m);return m}function rebuild(){avatar.clear();const v=Object.fromEntries(ids.map(k=>[k,+els[k].value]));const skin=[0xe4b58e,0xb77d58,0xf0c9a3,0x956247][v.face],cloth=[0x1b7797,0xc76a32,0x478e72,0x7c5cba][v.outfit],hair=[0x30221e,0x191b23,0x653d28,0x473326][v.hair];part(new THREE.CapsuleGeometry(.37,.67,5,12),cloth,0,1.52,0,v.body? .87:1,1,1);part(new THREE.SphereGeometry(.28,16,12),skin,0,2.32,0,1,v.face===2?1.1:1,1);part(new THREE.SphereGeometry(.29,16,12),hair,0,2.55,-.04,1,.48,1);if(v.hair===1)part(new THREE.CapsuleGeometry(.18,.55,4,8),hair,0,2.12,-.23);if(v.hair===2)part(new THREE.SphereGeometry(.17,12,8),hair,0,2.73,-.16);for(const s of [-1,1]){part(new THREE.CapsuleGeometry(.12,.63,4,8),cloth,s*.47,1.52,0).rotation.z=s*.17;part(new THREE.CapsuleGeometry(.15,.77,4,8),0x293b4b,s*.2,.57,0);part(new THREE.BoxGeometry(.3,.17,.46),0x18232c,s*.2,.12,.12)}document.getElementById('status').textContent='Đang xem mẫu: '+(v.body?'Nữ':'Nam')+' · kiểu '+(v.face+1)}ids.forEach(k=>els[k].addEventListener('change',rebuild));document.getElementById('random').onclick=()=>{ids.forEach(k=>els[k].selectedIndex=Math.floor(Math.random()*els[k].options.length));rebuild()};document.getElementById('save').onclick=()=>{localStorage.setItem('cuncun-character-v1',JSON.stringify(Object.fromEntries(ids.map(k=>[k,+els[k].value]))));document.getElementById('status').textContent='Đã lưu ngoại hình trên trình duyệt này'};try{const saved=JSON.parse(localStorage.getItem('cuncun-character-v1'));if(saved)ids.forEach(k=>{if(Number.isInteger(saved[k])&&saved[k]>=0&&saved[k]<els[k].options.length)els[k].value=saved[k]})}catch{}rebuild();function frame(){requestAnimationFrame(frame);const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();avatar.rotation.y+=.004;renderer.render(scene,camera)}frame();</script></body></html>
